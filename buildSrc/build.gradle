import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    // 1. 允许在 buildSrc 中编写 Kotlin 代码
    id 'org.jetbrains.kotlin.jvm' version '1.8.10'
    // 2. 只有加上这个，你定义的插件才能被主项目识别
    id 'java-gradle-plugin'
}

// 这里设置为 17 其实也没有任何问题，因为 buildSrc 的代码是作为插件运行在 gradle 的 build 脚本中的，gradle 的 jdk 是 17
// 因此这里可以设置成 jdk <= 17 的任何值，但是呢，com.android.tools.build:gradle 的 target jvm 是 11，所以，实际上
// 这里的值的范围只能是 11 <= version <= 17
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '11'
    }
}

repositories {
    google()
    mavenCentral() //必须
}

gradlePlugin {
    plugins {
        readmeProcess {
            id = 'me.liwenkun.readme-process'
            implementationClass = 'me.liwenkun.buildSrc.MyPlugin'
        }
    }
}


dependencies {
    compileOnly libs.gradle
    implementation libs.asm
    implementation libs.asm.util
    implementation libs.asm.commons
}